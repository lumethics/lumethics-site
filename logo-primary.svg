  <text x="210" y="178" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="104" font-weight="600" letter-spacing="6" fill="#C9A84C">LE</text>
  <text x="210" y="232" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="600" letter-spacing="3" fill="#F0F4FF">LUMETHICS</text>
  <text x="210" y="312" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" font-weight="500" fill="#C9A84C">Complexity, Converted</text>
</svg>
